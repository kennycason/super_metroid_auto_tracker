name: Build Cross-Platform

on:
  workflow_dispatch:  # Manual trigger only

jobs:
  build:
    strategy:
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          
      - name: Cache Gradle packages
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
            
      - name: Make gradlew executable
        run: chmod +x ./gradlew
        
      - name: Build application
        run: ./gradlew packageDistributionForCurrentOS
        
      - name: Upload macOS build
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: SuperMetroidAutoTracker-macOS-${{ github.run_number }}
          path: build/compose/binaries/main/dmg/*.dmg
          retention-days: 30
          
      - name: Validate Windows MSI
        if: runner.os == 'Windows'
        shell: pwsh
        timeout-minutes: 5
        run: |
          $msi = Get-ChildItem "build/compose/binaries/main/msi/*.msi" | Select-Object -First 1
          Write-Host "Validating MSI: $($msi.FullName)"
          Write-Host "MSI size: $([math]::Round($msi.Length / 1MB, 2)) MB"
          $extractDir = "$env:TEMP\msi-validate"
          $process = Start-Process msiexec -ArgumentList "/a", "`"$($msi.FullName)`"", "TARGETDIR=`"$extractDir`"", "/qn", "/l*v", "install.log" -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            Write-Host "MSI validation failed with exit code: $($process.ExitCode)"
            if (Test-Path install.log) { Get-Content install.log | Select-Object -Last 50 }
            exit 1
          }
          Write-Host "MSI validation succeeded"
          if (Test-Path install.log) { Get-Content install.log | Select-String "error|warning" -CaseSensitive:$false | Select-Object -Last 20 }

      - name: Upload Windows build
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: SuperMetroidAutoTracker-Windows-${{ github.run_number }}
          path: build/compose/binaries/main/msi/*.msi
          retention-days: 30
          
      - name: Upload Linux build
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: SuperMetroidAutoTracker-Linux-${{ github.run_number }}
          path: build/compose/binaries/main/deb/*.deb
          retention-days: 30
